name: Build installers and release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            family: windows
            runtime: win-x64
            package_arch: x86_64
          - name: macOS Apple Silicon
            runner: macos-15
            family: macos
            runtime: osx-arm64
            package_arch: arm64
          - name: Linux x64
            runner: ubuntu-24.04
            family: linux
            runtime: linux-x64
            package_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          value="${GITHUB_REF_NAME#v}"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained application
        shell: bash
        run: |
          dotnet publish TSM/TSM.csproj \
            --configuration Release \
            --runtime "${{ matrix.runtime }}" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:Version="${{ steps.version.outputs.value }}" \
            --output "artifacts/publish/${{ matrix.runtime }}"

      - name: Package Windows update ZIP
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          Compress-Archive -Path "artifacts/publish/${{ matrix.runtime }}/*" `
            -DestinationPath "artifacts/packages/TSM-${{ steps.version.outputs.value }}-windows-${{ matrix.package_arch }}.zip"

      - name: Build Windows installer
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          $projectRoot = (Resolve-Path ".").Path
          $publishDir = (Resolve-Path "artifacts/publish/${{ matrix.runtime }}").Path
          $outputDir = (Resolve-Path "artifacts/packages").Path
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DProjectRoot=$projectRoot" `
            "/DPublishDir=$publishDir" `
            "/DOutputDir=$outputDir" `
            packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create macOS application bundle
        if: matrix.family == 'macos'
        shell: bash
        run: |
          app="artifacts/stage/TradeSkillMaster.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" artifacts/packages /tmp/tsm.iconset
          cp -a "artifacts/publish/${{ matrix.runtime }}/." "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/TSM"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" TSM/Assets/tsm-app.png --out "/tmp/tsm.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" TSM/Assets/tsm-app.png --out "/tmp/tsm.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/tsm.iconset -o "$app/Contents/Resources/tsm-app.icns"
          plist="$app/Contents/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleName -string "TradeSkillMaster Cross-Platform" "$plist"
          plutil -insert CFBundleDisplayName -string "TradeSkillMaster Cross-Platform" "$plist"
          plutil -insert CFBundleIdentifier -string "com.wuild.tsm-app" "$plist"
          plutil -insert CFBundleExecutable -string "TSM" "$plist"
          plutil -insert CFBundleIconFile -string "tsm-app" "$plist"
          plutil -insert CFBundlePackageType -string "APPL" "$plist"
          plutil -insert CFBundleShortVersionString -string "${{ steps.version.outputs.value }}" "$plist"
          plutil -insert CFBundleVersion -string "${{ steps.version.outputs.value }}" "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "artifacts/packages/TSM-${{ steps.version.outputs.value }}-macos-${{ matrix.package_arch }}.zip"

      - name: Build macOS disk image
        if: matrix.family == 'macos'
        shell: bash
        run: |
          app="artifacts/stage/TradeSkillMaster.app"
          dmg_root="artifacts/stage/dmg-${{ matrix.runtime }}"
          dmg="artifacts/packages/TSM-${{ steps.version.outputs.value }}-macos-${{ matrix.package_arch }}.dmg"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -a "$app" "$dmg_root/TradeSkillMaster.app"
          ln -s /Applications "$dmg_root/Applications"
          cp "$app/Contents/Resources/tsm-app.icns" "$dmg_root/.VolumeIcon.icns"
          SetFile -a C "$dmg_root"
          hdiutil create -volname "TSM Desktop" -srcfolder "$dmg_root" -ov -format UDZO "$dmg"

      - name: Download appimagetool
        if: matrix.family == 'linux'
        shell: bash
        run: |
          curl --fail --location --show-error \
            --output /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool packaging/linux/build-appimage.sh

      - name: Build Linux AppImage
        if: matrix.family == 'linux'
        shell: bash
        run: |
          packaging/linux/build-appimage.sh \
            "artifacts/publish/${{ matrix.runtime }}" \
            artifacts/packages \
            "${{ steps.version.outputs.value }}" \
            /tmp/appimagetool \
            x86_64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSM-${{ steps.version.outputs.value }}-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release set
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all current packages
        uses: actions/download-artifact@v4
        with:
          pattern: TSM-*
          path: artifacts/packages
          merge-multiple: true

      - name: Attach packages to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  cleanup-old-artifacts:
    name: Remove older workflow artifacts
    needs: publish
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Delete artifacts from previous runs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const oldArtifactIds = [];
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const artifact of response.data) {
                if (artifact.workflow_run?.id === currentRun || !artifact.name.startsWith('TSM-')) continue;
                oldArtifactIds.push(artifact.id);
              }
            }
            for (const artifact_id of oldArtifactIds) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id });
            }
            core.info(`Deleted ${oldArtifactIds.length} old TSM workflow artifact(s).`);
